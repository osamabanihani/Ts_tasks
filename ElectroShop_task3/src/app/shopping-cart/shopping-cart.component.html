<section class="card">
  <h2>🛒 Shopping Cart</h2>

  @if (quantity > 0) {
    <p><strong>Product:</strong> {{ productName }}</p>
    <p><strong>Unit Price:</strong> ${{ productPrice }}</p>
    <p><strong>Quantity:</strong> {{ quantity }}</p>
    <div class="total">Total Price: ${{ productPrice * quantity }}</div>
  } @else {
    <p class="empty">Your shopping cart is empty.</p>
    <p class="hint">Choose a quantity and click Add to Cart.</p>
  }
</section>
