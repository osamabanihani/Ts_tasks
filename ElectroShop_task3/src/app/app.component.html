<header class="site-header">
  <div class="container">
    <h1>Electro<span>Shop</span></h1>
    <p>Product Management &amp; Shopping Cart</p>
  </div>
</header>

<main class="container">
  <div class="product-switcher">
    <span>Choose a product:</span>
    <button (click)="showLaptop()" [class.selected]="productName() === 'Laptop'">Laptop</button>
    <button (click)="showHeadphones()" [class.selected]="productName() === 'Wireless Headphones'">Wireless Headphones</button>
  </div>

  <div class="content-grid">
    <!-- Parent passes Signal values with @Input -->
    <app-product-details
      [productName]="productName()"
      [productDescription]="productDescription()"
      [productPrice]="productPrice()"
      [isAvailable]="isAvailable()"
      (addProduct)="addToCart($event)">
    </app-product-details>

    <!-- Parent passes selected product data to the cart -->
    <app-shopping-cart
      [productName]="cartName"
      [productPrice]="cartPrice"
      [quantity]="cartQuantity">
    </app-shopping-cart>
  </div>
</main>
